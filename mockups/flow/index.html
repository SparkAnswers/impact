<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flow Designer mockup</title>
<style>
:root{--bg:#0b0c10;--panel:#181b1f;--panel2:#111217;--border:#2c3235;--text:#d8d9da;--muted:#9aa0a6;
--blue:#3d8bff;--cyan:#19d3f0;--green:#2ee59d;--purple:#a66cff;--amber:#ffb020;--red:#ff5c5c;--input:#0f1114}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
font:12px/1.4 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.panel{position:absolute;inset:10px;background:var(--panel);border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
.hdr{height:32px;display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid #22262b;flex:none}
.hdr .title{font-weight:600;font-size:13px}.hdr .mode{font-size:10px;color:var(--cyan);border:1px solid #1c4a5c;background:#0f1f26;border-radius:3px;padding:1px 6px;letter-spacing:.3px}
.hdr .sp{flex:1}.hdr .dots{color:var(--muted);letter-spacing:2px;font-size:14px;line-height:0}
.body{flex:1;display:flex;min-height:0}
.canvas{flex:1;position:relative;background:var(--panel2);
background-image:radial-gradient(#2a2f36 1px,transparent 1.2px);background-size:20px 20px;background-position:10px 10px;overflow:hidden}
.canvas #svg{position:absolute;inset:0;width:100%;height:100%}
.tb{position:absolute;top:10px;left:10px;display:flex;gap:2px;background:#1b1f24;border:1px solid var(--border);border-radius:4px;padding:3px;box-shadow:0 4px 14px #0008;z-index:2}
.tb button{all:unset;width:24px;height:24px;display:grid;place-items:center;border-radius:3px;color:var(--muted);cursor:pointer}
.tb button:hover{background:#262b31;color:var(--text)}.tb button.on{background:#1c3b66;color:#fff}
.tb .sep{width:1px;background:var(--border);margin:3px 3px}.tb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zoom{position:absolute;left:10px;bottom:8px;color:var(--muted);font-size:11px;background:#1b1f24cc;border:1px solid var(--border);border-radius:3px;padding:2px 7px}
.insp{width:260px;flex:none;background:var(--panel);border-left:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.insp h3{margin:0;padding:8px 12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #22262b}
.insp .sel{padding:8px 12px;border-bottom:1px solid #22262b;display:flex;align-items:center;gap:8px}
.insp .sel b{font-weight:600}.insp .sel .chip{margin-left:auto;font-size:10px;color:var(--cyan);background:#0f1f26;border:1px solid #1c4a5c;border-radius:3px;padding:0 5px}
.sec{padding:6px 12px 4px;font-size:11px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;padding:3px 12px}.row label{width:84px;color:var(--muted);font-size:11px;flex:none}
.inp{flex:1;height:24px;background:var(--input);border:1px solid var(--border);border-radius:3px;padding:0 7px;display:flex;align-items:center;gap:6px;color:var(--text);font-size:12px;min-width:0}
.inp.sel-dd:after{content:"";margin-left:auto;border:4px solid transparent;border-top-color:var(--muted);transform:translateY(2px)}
.inp.sm{flex:0 0 58px}.inp .sw{width:12px;height:12px;border-radius:2px;flex:none}
.sl{flex:1;height:4px;background:#2c3235;border-radius:2px;position:relative}.sl i{position:absolute;left:0;top:0;height:100%;background:var(--blue);border-radius:2px}
.sl b{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--blue);transform:translate(-50%,-50%)}
.val{width:28px;text-align:right;color:var(--muted);font-size:11px}
.tog{width:30px;height:16px;border-radius:8px;background:#2c3235;position:relative}.tog.on{background:var(--blue)}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff}.tog.on:after{left:16px}
.seg{display:flex;flex:1;border:1px solid var(--border);border-radius:3px;overflow:hidden}.seg span{flex:1;text-align:center;padding:3px 0;font-size:11px;color:var(--muted);background:var(--input)}
.seg span.on{background:#1c3b66;color:#fff}
table.th{width:calc(100% - 24px);margin:2px 12px 6px;border-collapse:collapse;font-size:11px}
table.th td{padding:3px 4px;border-bottom:1px solid #22262b}table.th td:first-child{color:var(--muted);width:60px}
table.th .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.add{color:var(--blue);font-size:11px;padding:2px 12px 8px;cursor:pointer}
.node{cursor:grab}.node:active{cursor:grabbing}.node text{pointer-events:none;user-select:none}
.handle{cursor:move}
</style></head><body>
<div class="panel">
 <div class="hdr"><span class="title">Site Power Flow</span><span class="mode">DESIGN MODE</span><span class="sp"></span><span class="dots">•••</span></div>
 <div class="body">
  <div class="canvas" id="canvas">
   <div class="tb">
    <button class="on" title="Select"><svg viewBox="0 0 24 24"><path d="M4 3l7 17 2-7 7-2z"/></svg></button>

    <button title="Add edge"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 17c6 0 4-10 10-10"/></svg></button>
    <span class="sep"></span>
    <button title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button title="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="sep"></span>
    <button title="Fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="on" title="Grid"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
    <button title="Lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
   </div>
   <div class="zoom">100% · 10 nodes · 9 edges</div>
   <svg id="svg"></svg>
  </div>
  <div class="insp">
   <h3>Inspector</h3>
   <div class="sel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#19d3f0" stroke-width="2"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 17c6 0 4-10 10-10"/></svg><b>Edge</b><span style="color:var(--muted)">solar → site-bus</span><span class="chip">selected</span></div>
   <div class="sec">Path</div>
   <div class="row"><label>Style</label><div class="inp sel-dd">Bezier</div></div>
   <div class="row"><label>Curvature</label><div class="sl"><i style="width:55%"></i><b style="left:55%"></b></div><span class="val">0.55</span></div>
   <div class="row"><label>Stroke width</label><div class="inp sm">2</div><span class="val">px</span></div>
   <div class="row"><label>Color</label><div class="inp"><span class="sw" style="background:#19d3f0"></span>#19D3F0</div></div>
   <div class="row"><label>Dash</label><div class="seg"><span class="on">Solid</span><span>Dash</span><span>Dot</span></div></div>
   <div class="row"><label>Arrowhead</label><div class="tog on"></div></div>
   <div class="sec">Particles</div>
   <div class="row"><label>Speed</label><div class="sl"><i style="width:40%"></i><b style="left:40%"></b></div><span class="val">1.4×</span></div>
   <div class="row"><label>Count</label><div class="sl"><i style="width:30%"></i><b style="left:30%"></b></div><span class="val">3</span></div>
   <div class="row"><label>Glow</label><div class="tog on"></div></div>
   <div class="sec">Data</div>
   <div class="row"><label>Bind to field</label><div class="inp sel-dd"><span style="color:var(--muted)">A ·</span>solar_power_kw</div></div>
   <div class="row"><label>Map value to</label><div class="seg"><span class="on">Speed</span><span>Color</span><span>Width</span></div></div>
   <div class="sec">Thresholds</div>
   <table class="th">
    <tr><td>Base</td><td><span class="sw" style="background:#2ee59d"></span>Green</td><td style="color:var(--muted)">ok</td></tr>
    <tr><td>&ge; 10</td><td><span class="sw" style="background:#ffb020"></span>Amber</td><td style="color:var(--muted)">warn</td></tr>
    <tr><td>&ge; 14</td><td><span class="sw" style="background:#ff5c5c"></span>Red</td><td style="color:var(--muted)">error</td></tr>
   </table>
   <div class="add">+ Add threshold</div>
  </div>
 </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('svg');
const C={blue:'#3d8bff',cyan:'#19d3f0',green:'#2ee59d',purple:'#a66cff',amber:'#ffb020',red:'#ff5c5c'};
const ICON={ // simple inline icon paths (24x24)
 sun:'M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z',
 grid:'M12 3l-4 18M12 3l4 18M6 13h12M8 8h8M3 21h18',
 batt:'M3 8h15v8H3zM18 10h3v4h-3M6 10.5v3M9 10.5v3',
 gen:'M4 9h16v8H4zM4 13H2M22 13h-2M8 17v3M16 17v3M9 13l2-3 2 3 2-3',
 hub:'M12 3v4M12 17v4M3 12h4M17 12h4M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
 house:'M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6',
 car:'M4 15l2-6h12l2 6M3 15h18v4H3zM7 19v1M17 19v1M7 16h1M16 16h1',
 fan:'M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 10c0-5 6-5 6-2M12 14c0 5-6 5-6 2M10 12c-5 0-5-6-2-6M14 12c5 0 5 6 2 6',
 srv:'M4 5h16v5H4zM4 14h16v5H4zM7 7.5h1M7 16.5h1',
 exp:'M4 12h12M12 7l5 5-5 5M20 4v16'};
const nodes=[
 {id:'solar',x:40,y:120,w:140,h:52,type:'card',icon:'sun',label:'Solar Array',sub:'12.4 kW',st:'ok'},
 {id:'grid',x:40,y:200,w:140,h:52,type:'card',icon:'grid',label:'Grid Import',sub:'3.1 kW',st:'warn'},
 {id:'batt',x:40,y:280,w:140,h:52,type:'card',icon:'batt',label:'Battery',sub:'68 % · 2.0 kW',st:'ok'},
 {id:'gen',x:40,y:360,w:140,h:52,type:'card',icon:'gen',label:'Generator',sub:'offline',st:'err'},
 {id:'hub',x:330,y:205,w:160,h:110,type:'hub',icon:'hub',label:'Site Bus',sub:'17.5 kW',st:'ok'},
 {id:'house',x:620,y:100,w:150,h:52,type:'card',icon:'house',label:'House Loads',sub:'6.2 kW',st:'ok'},
 {id:'ev',x:620,y:182,w:132,h:32,type:'pill',icon:'car',label:'EV Charger',st:'ok'},
 {id:'hvac',x:620,y:244,w:132,h:32,type:'pill',icon:'fan',label:'HVAC',st:'warn'},
 {id:'srv',x:620,y:306,w:132,h:32,type:'pill',icon:'srv',label:'Server Room',st:'ok'},
 {id:'exp',x:620,y:380,w:150,h:52,type:'card',icon:'exp',label:'Grid Export',sub:'4.6 kW',st:'ok'}];
const edges=[
 {id:'e1',fi:.2,from:'solar',to:'hub',style:'bezier',k:.55,c2r:{x:-95,y:-40},color:C.cyan,w:2,speed:2.2,n:3,arrow:true,selected:true},
 {id:'e2',fi:.4,from:'grid',to:'hub',style:'ortho',color:C.amber,w:1.5,speed:3,n:2,arrow:true},
 {id:'e3',fi:.6,from:'batt',to:'hub',style:'bezier',k:.5,color:C.blue,w:1.5,speed:2.6,n:2},
 {id:'e4',fi:.8,from:'gen',to:'hub',style:'straight',color:C.red,w:1.2,dash:'4 5',speed:0,n:0},
 {id:'e5',fo:.15,from:'hub',to:'house',style:'bezier',k:.6,color:C.green,w:2,speed:2,n:3,arrow:true},
 {id:'e6',fo:.32,from:'hub',to:'ev',style:'ortho',color:C.green,w:1.5,speed:2.4,n:2,arrow:true},
 {id:'e7',fo:.5,from:'hub',to:'hvac',style:'straight',color:C.purple,w:1.5,speed:3.2,n:2,arrow:true},
 {id:'e8',fo:.68,from:'hub',to:'srv',style:'ortho',color:C.blue,w:1.5,speed:2.8,n:2,arrow:true},
 {id:'e9',fo:.85,from:'hub',to:'exp',style:'bezier',k:.6,color:C.cyan,w:1.5,speed:2.2,n:2,arrow:true}];
const N=Object.fromEntries(nodes.map(n=>[n.id,n]));
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
// defs: glow filters + arrow markers
const defs=el('defs',{},svg);
const glow=el('filter',{id:'glow',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);
el('feGaussianBlur',{stdDeviation:'2.2',result:'b'},glow);const m=el('feMerge',{},glow);el('feMergeNode',{in:'b'},m);el('feMergeNode',{in:'SourceGraphic'},m);
const pg=el('filter',{id:'pglow',x:'-200%',y:'-200%',width:'500%',height:'500%'},defs);
el('feGaussianBlur',{stdDeviation:'2.5',result:'b'},pg);const m2=el('feMerge',{},pg);el('feMergeNode',{in:'b'},m2);el('feMergeNode',{in:'b'},m2);el('feMergeNode',{in:'SourceGraphic'},m2);
const sh=el('filter',{id:'shadow',x:'-20%',y:'-20%',width:'140%',height:'160%'},defs);el('feDropShadow',{dx:0,dy:3,stdDeviation:4,'flood-color':'#000','flood-opacity':.55},sh);
edges.forEach(e=>{const mk=el('marker',{id:'arr-'+e.id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
 el('path',{d:'M1 1.5 L8.5 5 L1 8.5 z',fill:e.color},mk);});
const gEdges=el('g',{},svg), gParts=el('g',{},svg), gNodes=el('g',{},svg), gSel=el('g',{},svg);
const port=(n,side,f=.5)=>side==='out'?{x:n.x+n.w,y:n.y+n.h*f}:{x:n.x,y:n.y+n.h*f};
function pathFor(e){const a=port(N[e.from],'out',e.fo),b=port(N[e.to],'in',e.fi);const dx=b.x-a.x;
 if(e.style==='straight')return `M${a.x} ${a.y} L${b.x} ${b.y}`;
 if(e.style==='ortho'){const r=10,mx=a.x+dx/2,dy=b.y-a.y,s=Math.sign(dy)||1;if(Math.abs(dy)<2*r)return `M${a.x} ${a.y} L${b.x} ${b.y}`;
  return `M${a.x} ${a.y} H${mx-r} Q${mx} ${a.y} ${mx} ${a.y+s*r} V${b.y-s*r} Q${mx} ${b.y} ${mx+r} ${b.y} H${b.x}`;}
 const c1=e.c1r?{x:a.x+e.c1r.x,y:a.y+e.c1r.y}:{x:a.x+dx*e.k,y:a.y},c2=e.c2r?{x:b.x+e.c2r.x,y:b.y+e.c2r.y}:{x:b.x-dx*e.k,y:b.y};e._c=[a,c1,c2,b];
 return `M${a.x} ${a.y} C${c1.x} ${c1.y} ${c2.x} ${c2.y} ${b.x} ${b.y}`;}
// edges
edges.forEach(e=>{const g=el('g',{},gEdges);
 e.halo=el('path',{fill:'none',stroke:e.color,'stroke-width':e.w+4,opacity:.22,filter:'url(#glow)','stroke-linecap':'round'},g);
 e.p=el('path',{id:'p-'+e.id,fill:'none',stroke:e.color,'stroke-width':e.w,'stroke-linecap':'round',opacity:e.selected?1:.85},g);
 if(e.dash)e.p.setAttribute('stroke-dasharray',e.dash);if(e.arrow)e.p.setAttribute('marker-end',`url(#arr-${e.id})`);
 for(let i=0;i<e.n;i++){const c=el('circle',{r:e.w+1.2,fill:'#fff',filter:'url(#pglow)'},gParts);el('circle',{r:e.w+3,fill:e.color,opacity:.5,filter:'url(#pglow)'},gParts);
  const inner=gParts.lastChild;[c,inner].forEach(k=>{const am=el('animateMotion',{dur:(1/e.speed*2.5).toFixed(2)+'s',repeatCount:'indefinite',begin:(-i*2.5/e.speed/e.n).toFixed(2)+'s'},k);
  el('mpath',{href:'#p-'+e.id},am);});}
 e.p.addEventListener('click',()=>{edges.forEach(x=>x.selected=false);e.selected=true;renderSel();});});
function renderEdges(){edges.forEach(e=>{const d=pathFor(e);e.p.setAttribute('d',d);e.halo.setAttribute('d',d);});renderSel();}
function renderSel(){gSel.innerHTML='';const e=edges.find(x=>x.selected);if(!e)return;
 const d=e.p.getAttribute('d');el('path',{d,fill:'none',stroke:'#fff','stroke-width':e.w+6,opacity:.08},gSel);
 el('path',{d,fill:'none',stroke:'#fff','stroke-width':1,'stroke-dasharray':'3 3',opacity:.4},gSel);
 if(e._c){const [a,c1,c2,b]=e._c;[[a,c1,'c1'],[b,c2,'c2']].forEach(([p,c,key])=>{
   el('line',{x1:p.x,y1:p.y,x2:c.x,y2:c.y,stroke:'#fff','stroke-width':1,opacity:.5,'stroke-dasharray':'2 2'},gSel);
   const h=el('circle',{cx:c.x,cy:c.y,r:4.5,fill:'#181b1f',stroke:'#fff','stroke-width':1.5,class:'handle'},gSel);
   h.addEventListener('pointerdown',ev=>{ev.stopPropagation();dragCP(ev,e,key);});});
  [a,b].forEach(p=>el('rect',{x:p.x-3.5,y:p.y-3.5,width:7,height:7,fill:'#fff',stroke:e.color,'stroke-width':1.5},gSel));}}
// nodes
nodes.forEach(n=>{const g=el('g',{class:'node',transform:`translate(${n.x},${n.y})`},gNodes);n.g=g;
 const hub=n.type==='hub',pill=n.type==='pill',col={ok:C.green,warn:C.amber,err:C.red}[n.st];
 el('rect',{width:n.w,height:n.h,rx:pill?16:8,fill:hub?'#1c2330':'#1f2328',stroke:hub?'#2a4a7a':'#2c3235','stroke-width':hub?1.2:1,filter:'url(#shadow)'},g);
 if(hub)el('rect',{x:.5,y:.5,width:n.w-1,height:n.h-1,rx:8,fill:'none',stroke:C.blue,opacity:.35,filter:'url(#glow)'},g);
 if(pill){el('circle',{cx:14,cy:n.h/2,r:4,fill:col},g);}
 else{const cp=el('clipPath',{id:'cl-'+n.id},defs);el('rect',{width:n.w,height:n.h,rx:8},cp);
  el('rect',{width:3,height:n.h,fill:col,'clip-path':`url(#cl-${n.id})`},g);}
 const isz=hub?22:(pill?14:18),ix=pill?26:12,iy=(n.h-isz)/2;
 const ig=el('g',{transform:`translate(${ix},${iy}) scale(${isz/24})`,fill:'none',stroke:hub?C.cyan:(pill?C.green:'#c8ccd2'),'stroke-width':hub?1.7:2,'stroke-linecap':'round','stroke-linejoin':'round'},g);
 el('path',{d:ICON[n.icon]},ig);
 const tx=ix+isz+(pill?7:10);
 const t=el('text',{x:tx,y:pill?n.h/2+4:(n.sub?n.h/2-3:n.h/2+4),fill:'#e6e7e9','font-size':hub?13:12,'font-weight':hub?600:500},g);t.textContent=n.label;
 if(n.sub&&!pill){const s=el('text',{x:tx,y:n.h/2+12,fill:n.st==='err'?C.red:(hub?C.cyan:'#9aa0a6'),'font-size':hub?12:11,'font-weight':hub?500:400},g);s.textContent=n.sub;}
 if(hub){el('rect',{x:n.w-40,y:10,width:30,height:14,rx:7,fill:'#0f1f26',stroke:'#1c4a5c'},g);const b=el('text',{x:n.w-25,y:20,'text-anchor':'middle',fill:C.cyan,'font-size':9,'font-weight':600},g);b.textContent='HUB';}
 // ports
 const ins=edges.filter(e=>e.to===n.id).map(e=>e.fi||.5),outs=edges.filter(e=>e.from===n.id).map(e=>e.fo||.5);
 ins.forEach(f=>el('circle',{cx:0,cy:n.h*f,r:3,fill:'#181b1f',stroke:'#5a6270','stroke-width':1},g));outs.forEach(f=>el('circle',{cx:n.w,cy:n.h*f,r:3,fill:'#181b1f',stroke:'#5a6270','stroke-width':1},g));
 g.addEventListener('pointerdown',ev=>dragNode(ev,n));});
// drag logic
function pt(ev){const r=svg.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
function dragNode(ev,n){const s=pt(ev),ox=n.x,oy=n.y;ev.preventDefault();n.g.setPointerCapture(ev.pointerId);
 const mv=e=>{const p=pt(e);n.x=Math.round((ox+p.x-s.x)/2)*2;n.y=Math.round((oy+p.y-s.y)/2)*2;n.g.setAttribute('transform',`translate(${n.x},${n.y})`);renderEdges();};
